name: Build and push images

# Builds the FrameBucket backend image (Spring Boot + bundled React app) and, for staging, the
# standalone nginx frontend image, then pushes them to the target environment's ECR repositories.
# Run the matching Terraform workflow first so the repositories exist. Deploy afterwards with
# "Terraform Prod" / "Terraform Staging EKS" -> operation "deploy" in the fb_terraform repository.

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Which environment's registry to push to"
        required: true
        type: choice
        options:
          - staging
          - prod
        default: staging

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-images-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  build:
    name: Build for ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.target_environment }}
    env:
      REPO_PREFIX: framebucket-${{ inputs.target_environment }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.REPO_PREFIX }}/backend:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.REPO_PREFIX }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image (staging / EKS only)
        if: inputs.target_environment == 'staging'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.REPO_PREFIX }}/frontend:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.REPO_PREFIX }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Summary
        run: |
          {
            echo "### Images pushed to ${REPO_PREFIX}"
            echo ""
            echo "Image tag: \`${IMAGE_TAG}\` (also tagged \`latest\`)"
            echo ""
            echo "Deploy from **fb_terraform → Actions** with operation \`deploy\` and backend image tag \`${IMAGE_TAG}\` (or \`latest\`)."
          } >> "$GITHUB_STEP_SUMMARY"
