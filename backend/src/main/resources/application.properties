spring.application.name=framebucket-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fb_main}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:S$$@ssion123321}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# FrameBucket owners/admins (comma separated emails of photographer accounts) get the /admin portal.
app.admin.emails=${APP_ADMIN_EMAILS:}

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Local development logs verification links. Set APP_EMAIL_MODE=smtp and the MAIL_* values for real delivery.
app.email.mode=${APP_EMAIL_MODE:console}
app.email.from=${APP_EMAIL_FROM:no-reply@framebucket.local}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
# Keep console mode for local development; use APP_SMS_MODE=whatsapp to send OTPs via Cloud API.
app.sms.mode=${APP_SMS_MODE:console}
app.verification.otp-hmac-secret=${OTP_HMAC_SECRET:local-development-only-change-this-secret}
app.sub-id.encryption-key=${APP_SUB_ID_ENCRYPTION_KEY:framebucket-local-sub-id-key-replace-before-deploy}
app.whatsapp.mode=${APP_WHATSAPP_MODE:console}
app.whatsapp.messages-url=${WHATSAPP_MESSAGES_URL:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.language=${WHATSAPP_TEMPLATE_LANGUAGE:en}
app.whatsapp.enquiry-template=${WHATSAPP_ENQUIRY_TEMPLATE:framebucket_enquiry_quote_link}
app.whatsapp.enquiry-language=${WHATSAPP_ENQUIRY_TEMPLATE_LANGUAGE:${app.whatsapp.language}}
app.whatsapp.submitted-template=${WHATSAPP_QUOTE_SUBMITTED_TEMPLATE:framebucket_quote_submitted}
app.whatsapp.submitted-language=${WHATSAPP_QUOTE_SUBMITTED_TEMPLATE_LANGUAGE:${app.whatsapp.language}}
app.whatsapp.team-invite-template=${WHATSAPP_TEAM_INVITE_TEMPLATE:framebucket_team_member_invite}
app.whatsapp.team-invite-language=${WHATSAPP_TEAM_INVITE_TEMPLATE_LANGUAGE:${app.whatsapp.language}}
app.whatsapp.assignment-customer-template=${WHATSAPP_ASSIGNMENT_CUSTOMER_TEMPLATE:framebucket_event_assignment_customer}
app.whatsapp.assignment-customer-language=${WHATSAPP_ASSIGNMENT_CUSTOMER_TEMPLATE_LANGUAGE:${app.whatsapp.language}}
app.whatsapp.assignment-assignee-template=${WHATSAPP_ASSIGNMENT_ASSIGNEE_TEMPLATE:framebucket_event_assignment_assignee}
app.whatsapp.assignment-assignee-language=${WHATSAPP_ASSIGNMENT_ASSIGNEE_TEMPLATE_LANGUAGE:${app.whatsapp.language}}
app.whatsapp.mobile-verification-template=${WHATSAPP_MOBILE_VERIFICATION_TEMPLATE:framebucket_mobile_verification}
app.whatsapp.mobile-verification-language=${WHATSAPP_MOBILE_VERIFICATION_TEMPLATE_LANGUAGE:${app.whatsapp.language}}
app.whatsapp.album-design-template=${WHATSAPP_ALBUM_DESIGN_TEMPLATE:framebucket_album_selection_finalized}
app.whatsapp.album-design-language=${WHATSAPP_ALBUM_DESIGN_TEMPLATE_LANGUAGE:${app.whatsapp.language}}
app.whatsapp.photo-match-template=${WHATSAPP_PHOTO_MATCH_TEMPLATE:framebucket_event_photo_match}
app.whatsapp.photo-match-language=${WHATSAPP_PHOTO_MATCH_TEMPLATE_LANGUAGE:${app.whatsapp.language}}
# Optional approved Meta template for day-before event reminders (params: event type, studio, date/time, location).
# Leave blank to send reminders by email only.
app.whatsapp.event-reminder-template=${WHATSAPP_EVENT_REMINDER_TEMPLATE:}
app.whatsapp.event-reminder-language=${WHATSAPP_EVENT_REMINDER_TEMPLATE_LANGUAGE:${app.whatsapp.language}}
# Day-before event reminders (cron runs in Asia/Kolkata).
app.reminders.enabled=${APP_REMINDERS_ENABLED:true}
app.reminders.cron=${APP_REMINDERS_CRON:0 0 9 * * *}
app.gallery.photo-delivery-poll-ms=${GALLERY_PHOTO_DELIVERY_POLL_MS:5000}
app.data-service.base-url=${DATA_SERVICE_BASE_URL:http://127.0.0.1:8001}
app.data-service.token=${DATA_SERVICE_TOKEN:}
# Poll interval for face-match and album-ready notifications produced by data-service workers.
app.data-service.outbox-poll-ms=${DATA_SERVICE_OUTBOX_POLL_MS:5000}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:1GB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:1GB}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# Landing-page platform statistics are shown only once this many verified photographers have joined.
app.public-stats.min-photographers=${PUBLIC_STATS_MIN_PHOTOGRAPHERS:50}
