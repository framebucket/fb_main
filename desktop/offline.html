<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>FrameBucket</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #1c1a17; color: #f1ece4;
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 420px; text-align: center; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #b9b0a2; margin: 0 0 22px; }
  button { background: #b8893f; color: #1c1a17; border: 0; border-radius: 999px; padding: 10px 26px; font: inherit;
           font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Can't reach FrameBucket</h1>
  <p>Check your internet connection, then try again.</p>
  <button id="retry" type="button">Try again</button>
</main>
<script>
  const target = new URLSearchParams(location.search).get('url');
  document.getElementById('retry').addEventListener('click', () => { if (target) location.href = target; });
</script>
</body>
</html>
