<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FrameBucket</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: #1c1a17; color: #f1ece4;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 340px; text-align: center; padding: 24px; }
  img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 18px; }
  h1 { font-size: 21px; margin: 0 0 8px; }
  p { color: #b9b0a2; margin: 0 0 24px; }
  button { background: #b8893f; color: #1c1a17; border: 0; border-radius: 999px; padding: 12px 30px; font: inherit;
           font-weight: 600; }
</style>
<script src="config.js"></script>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Can't reach FrameBucket</h1>
  <p>Check your internet connection, then try again.</p>
  <button id="retry" type="button">Try again</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () {
    if (window.FB_APP_URL) location.href = window.FB_APP_URL;
  });
</script>
</body>
</html>
